<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131c"><title>Vaporeasy V2 • Staging</title>
<style>
:root{--b:#07131c;--p:#0c1f2b;--l:#214659;--t:#f4f9fc;--m:#91aabc;--a:#13aeea;--g:#18b96f;--r:#b74953}*{box-sizing:border-box}body{margin:0;background:#02090f;color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;min-height:100vh;margin:auto;background:linear-gradient(#06131d,#031018)}header{position:sticky;top:0;background:#f7fafc;color:#082232;padding:13px 16px;display:flex;justify-content:space-between;z-index:5}.brand{font-size:20px;font-weight:900}.brand span{color:#078fcd}.tag{font-size:10px;font-weight:900;color:#087aaa}.profile{text-align:right;font-size:11px}main{padding:18px 15px 90px}.hidden{display:none!important}.card,.item{background:linear-gradient(150deg,#102a39,#0b1d29);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:11px}.title{font-size:27px;font-weight:900;margin:3px 0}.sub{color:var(--m);line-height:1.45;margin:0 0 14px}.stack{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:grid;gap:5px;color:#aac0cd;font-size:11px;font-weight:800}input,select,textarea{width:100%;min-height:44px;border:1px solid #2b5368;border-radius:11px;background:#061722;color:#fff;padding:10px;font:inherit}textarea{min-height:72px}button{min-height:42px;border:0;border-radius:11px;padding:9px 12px;font-weight:850;cursor:pointer}.primary{background:#109fd9;color:#fff}.ghost{background:#102a39;color:#e8f5fb;border:1px solid #2b566d}.danger{background:var(--r);color:#fff}.success{background:#139e60;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions>*{flex:1}.notice{padding:10px;border-radius:11px;background:#08293a;border:1px solid #15516d;color:#d8f0fb;margin-bottom:10px}.error{background:#35181c;border-color:#6d343a}.ok{background:#113022;border-color:#286348}.item h3{margin:0 0 4px}.meta{color:var(--m);font-size:12px;line-height:1.5}.time{font-size:21px;font-weight:900;color:#73d6fb}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}.tabs .active{background:var(--a);color:#fff}.pill{display:inline-block;padding:4px 7px;border:1px solid #2f5b70;border-radius:999px;font-size:10px}.login{padding-top:45px}.login .brand{font-size:31px}.empty{border:1px dashed #31576a;border-radius:13px;padding:16px;text-align:center;color:var(--m)}dialog{width:min(560px,calc(100% - 24px));max-height:88vh;overflow:auto;background:#0b1d29;color:#fff;border:1px solid var(--l);border-radius:16px;padding:14px}dialog::backdrop{background:rgba(0,0,0,.72)}@media(max-width:470px){.row{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header id="hdr" class="hidden"><div><div class="brand">Vapor<span>easy</span></div><div class="tag">STAGING V2</div></div><div class="profile"><b id="pname">—</b><div id="prole">—</div></div></header>
<main>
<section id="auth" class="login">
<div class="card"><div class="brand">Vapor<span>easy</span></div><p class="sub">Ambiente de homologação separado da produção.</p><div id="amsg" class="notice hidden"></div>
<div class="tabs"><button id="lin" class="ghost active">Entrar</button><button id="sup" class="ghost">Primeiro acesso</button><span></span></div>
<form id="af" class="stack"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="pass" type="password" minlength="8" required></label><button id="ab" class="primary">Entrar</button></form>
</div></section>
<section id="main" class="hidden">
<div class="tabs"><button id="tc" class="ghost active">Cadastro</button><button id="ta" class="ghost">Agenda</button><button id="out" class="ghost">Sair</button></div>
<div id="msg" class="notice hidden"></div>
<section id="cad"><div class="title">Cadastro</div><p class="sub">Cliente e veículo usando o novo banco do staging.</p><div class="actions" style="margin-bottom:10px"><button id="nc" class="primary">+ Cliente</button><button id="rc" class="ghost">Atualizar</button></div><input id="q" placeholder="Buscar cliente"><div id="clients"></div></section>
<section id="age" class="hidden"><div class="title">Agenda</div><p class="sub">Duplicidade e sobreposição bloqueadas no banco.</p><div class="row"><label>Data<input id="date" type="date"></label><label>&nbsp;<button id="na" class="primary">+ Agendamento</button></label></div><div id="apps"></div></section>
</section>
</main>
<dialog id="cd"><form id="cf" class="stack"><input id="cid" type="hidden"><h3>Cliente</h3><label>Nome<input id="cn" required></label><div class="row"><label>Telefone<input id="cp"></label><label>WhatsApp<input id="cw"></label></div><label>Condomínio<input id="cc"></label><label>Endereço<input id="ca"></label><label>Observações<textarea id="co"></textarea></label><div class="actions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></dialog>
<dialog id="vd"><form id="vf" class="stack"><input id="vid" type="hidden"><input id="vcid" type="hidden"><h3>Veículo</h3><div class="row"><label>Marca<input id="vb" required></label><label>Modelo<input id="vm" required></label></div><div class="row"><label>Placa<input id="vp"></label><label>Ano<input id="vy"></label></div><label>Cor<input id="vco"></label><div class="actions"><button type="button" class="ghost" data-close>Cancelar</button><button class="primary">Salvar</button></div></form></dialog>
<dialog id="ad"><form id="apf" class="stack"><h3>Novo agendamento</h3><div id="apmsg" class="notice hidden"></div><label>Cliente<select id="ac" required></select></label><label>Veículo<select id="av" required></select></label><label>Serviço<select id="as" required></select></label><label>Colaborador<select id="acol"><option value="">Equipe não definida</option></select></label><div class="row"><label>Data<input id="adt" type="date" required></label><label>Horário<input id="atm" type="time" required></label></div><label>Observações<textarea id="an"></textarea></label><div class="actions"><button type="button" class="ghost" data-close>Cancelar</button><button id="apsave" class="primary">Agendar</button></div></form></dialog>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm";
const URL="https://asuppjeomaymzromgcrp.supabase.co", KEY="sb_publishable_LfmsuPyDMKnyKHGh0x7Akw_yJfQ15bI";
const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id); let mode="login", clients=[], services=[], collabs=[], vehicles=new Map();
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const plate=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,7);
const money=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n||0));
const clock=i=>new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date(i));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fail=e=>{const m=String(e?.message||e||"Erro");if(e?.code==="23P01")return"Conflito de horário: colaborador ou veículo já ocupado.";if(e?.code==="23505"){if(m.includes("appointments_active_vehicle_start_uq"))return"Este veículo já possui esse serviço agendado nesse horário. Escolha outro horário ou cancele o agendamento existente.";if(m.includes("appointments_active_collaborator_start_uq"))return"Este colaborador já está ocupado nesse horário. Escolha outro horário ou outro colaborador.";return"Já existe um agendamento igual ou conflitante.";}if(e?.code==="23503")return"Cliente e veículo não correspondem.";return m};
function show(id,text,type=""){const e=$(id);e.textContent=text;e.className="notice "+type;e.classList.toggle("hidden",!text)}
async function boot(){ $("date").value=today();$("adt").value=today();$("atm").value="08:00"; wire(); const {data}=await sb.auth.getSession(); if(data.session) await enter(data.session); }
function wire(){
 $("lin").onclick=()=>authMode("login");$("sup").onclick=()=>authMode("signup");$("af").onsubmit=authSubmit;$("out").onclick=async()=>{await sb.auth.signOut({scope:"local"});location.reload()};
 $("tc").onclick=()=>tab("cad");$("ta").onclick=()=>tab("age");$("rc").onclick=loadClients;$("nc").onclick=()=>openClient();$("cf").onsubmit=saveClient;$("vf").onsubmit=saveVehicle;
 $("na").onclick=openAppt;$("apf").onsubmit=saveAppt;$("ac").onchange=()=>fillVehicles($("ac").value);$("date").onchange=loadApps;$("q").oninput=renderClients;
 document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
}
function authMode(m){mode=m;$("lin").classList.toggle("active",m==="login");$("sup").classList.toggle("active",m==="signup");$("ab").textContent=m==="login"?"Entrar":"Criar acesso";show("amsg","")}
async function authSubmit(e){e.preventDefault();$("ab").disabled=true;show("amsg","");try{let r;if(mode==="signup"){r=await sb.auth.signUp({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error;if(!r.data.session){show("amsg","Conta criada. Confirme o e-mail e depois entre.","ok");return}}else{r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)throw r.error}await enter(r.data.session)}catch(e){show("amsg",fail(e),"error")}finally{$("ab").disabled=false}}
async function enter(session){try{const br=await fetch("https://asuppjeomaymzromgcrp.supabase.co/functions/v1/vaporeasy-v2-staging?action=bootstrap",{method:"POST",headers:{authorization:"Bearer "+session.access_token}});const bj=await br.json();if(!br.ok&&br.status!==403)throw Error(bj.error||"Falha no acesso");const u=await sb.auth.getUser();if(u.error)throw u.error;const p=await sb.from("app_profiles").select("name,role,active").eq("user_id",u.data.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Este usuário ainda não possui acesso ao staging.");$("pname").textContent=p.data.name||u.data.user.email.split("@")[0];$("prole").textContent=p.data.role;show("amsg","");$("auth").classList.add("hidden");$("main").classList.remove("hidden");$("hdr").classList.remove("hidden");$("auth").style.display="none";$("main").style.display="block";$("hdr").style.display="flex";window.scrollTo(0,0);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await refs();await loadClients();await loadApps()}catch(e){show("amsg",fail(e),"error")}}
async function refs(){let [s,c]=await Promise.all([sb.from("services").select("*").eq("active",true).order("name"),sb.from("collaborators").select("*").eq("active",true).order("name")]);if(s.error)throw s.error;if(c.error)throw c.error;services=s.data||[];collabs=c.data||[]}
async function loadClients(){const r=await sb.from("clients").select("*").is("archived_at",null).order("name");if(r.error)return show("msg",fail(r.error),"error");clients=r.data||[];renderClients()}
function renderClients(){const q=($("q").value||"").toLowerCase();const rows=clients.filter(x=>(x.name+" "+x.phone+" "+x.whatsapp).toLowerCase().includes(q));$("clients").innerHTML=rows.length?rows.map(c=>'<div class="item"><h3>'+esc(c.name)+'</h3><div class="meta">'+esc(c.phone||c.whatsapp||"Sem telefone")+'</div><div class="actions" style="margin-top:9px"><button class="ghost" data-v="'+c.id+'">Veículos</button><button class="ghost" data-e="'+c.id+'">Editar</button><button class="primary" data-n="'+c.id+'">+ Veículo</button></div><div id="v-'+c.id+'" class="hidden"></div></div>').join(""):'<div class="empty">Nenhum cliente.</div>';document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>openClient(clients.find(x=>x.id===b.dataset.e)));document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>openVehicle(b.dataset.n));document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>showVehicles(b.dataset.v))}
function openClient(c){$("cf").reset();$("cid").value=c?.id||"";$("cn").value=c?.name||"";$("cp").value=c?.phone||"";$("cw").value=c?.whatsapp||"";$("ca").value=c?.address||"";$("co").value=c?.notes||"";$("cc").value="";$("cd").showModal()}
async function saveClient(e){e.preventDefault();try{let condo=null, name=$("cc").value.trim();if(name){let f=await sb.from("condominiums").select("id").ilike("name",name).limit(1).maybeSingle();if(f.error)throw f.error;if(f.data)condo=f.data.id;else{let n=await sb.from("condominiums").insert({name}).select("id").single();if(n.error)throw n.error;condo=n.data.id}}const p={name:$("cn").value.trim(),phone:$("cp").value.trim(),whatsapp:$("cw").value.trim(),address:$("ca").value.trim(),notes:$("co").value.trim(),condominium_id:condo};let r=$("cid").value?await sb.from("clients").update(p).eq("id",$("cid").value):await sb.from("clients").insert(p);if(r.error)throw r.error;$("cd").close();show("msg","Cliente salvo.","ok");await loadClients()}catch(e){show("msg",fail(e),"error")}}
async function showVehicles(cid){const box=$("v-"+cid);box.classList.toggle("hidden");if(box.classList.contains("hidden"))return;let r=await sb.from("vehicles").select("*").eq("client_id",cid).is("archived_at",null).order("brand");if(r.error){box.innerHTML='<div class="notice error">'+esc(fail(r.error))+'</div>';return}vehicles.set(cid,r.data||[]);box.innerHTML=(r.data||[]).length?(r.data||[]).map(v=>'<div class="item" style="margin-top:8px"><b>'+esc(v.brand+" "+v.model)+'</b><div class="meta">'+esc(v.plate||"Sem placa")+'</div><div class="actions" style="margin-top:7px"><button class="ghost" data-ve="'+v.id+'" data-c="'+cid+'">Editar</button><button class="danger" data-vx="'+v.id+'" data-c="'+cid+'">Excluir</button></div></div>').join(""):'<div class="empty">Nenhum veículo.</div>';box.querySelectorAll("[data-ve]").forEach(b=>b.onclick=()=>openVehicle(cid,(r.data||[]).find(x=>x.id===b.dataset.ve)));box.querySelectorAll("[data-vx]").forEach(b=>b.onclick=async()=>{if(!confirm("Excluir veículo? O histórico será preservado."))return;let x=await sb.from("vehicles").update({archived_at:new Date().toISOString()}).eq("id",b.dataset.vx);if(x.error)return show("msg",fail(x.error),"error");await showVehicles(cid);await showVehicles(cid)})}
function openVehicle(cid,v){$("vf").reset();$("vcid").value=cid;$("vid").value=v?.id||"";$("vb").value=v?.brand||"";$("vm").value=v?.model||"";$("vp").value=v?.plate||"";$("vy").value=v?.year||"";$("vco").value=v?.color||"";$("vd").showModal()}
async function saveVehicle(e){e.preventDefault();try{const p={client_id:$("vcid").value,brand:$("vb").value.trim(),model:$("vm").value.trim(),plate:plate($("vp").value)||null,year:$("vy").value.trim(),color:$("vco").value.trim()};let r=$("vid").value?await sb.from("vehicles").update(p).eq("id",$("vid").value):await sb.from("vehicles").insert(p);if(r.error)throw r.error;$("vd").close();show("msg","Veículo salvo.","ok");renderClients()}catch(e){show("msg",fail(e),"error")}}
function tab(x){$("cad").classList.toggle("hidden",x!=="cad");$("age").classList.toggle("hidden",x!=="age");$("tc").classList.toggle("active",x==="cad");$("ta").classList.toggle("active",x==="age");if(x==="age")loadApps()}
function fillSelects(){$("ac").innerHTML='<option value="">Selecione</option>'+clients.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("");$("as").innerHTML='<option value="">Selecione</option>'+services.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' • '+money(s.price)+'</option>').join("");$("acol").innerHTML='<option value="">Equipe não definida</option>'+collabs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")}
async function fillVehicles(cid){let r=await sb.from("vehicles").select("*").eq("client_id",cid).is("archived_at",null).order("brand");if(r.error)return show("msg",fail(r.error),"error");vehicles.set(cid,r.data||[]);$("av").innerHTML='<option value="">Selecione</option>'+(r.data||[]).map(v=>'<option value="'+v.id+'">'+esc(v.brand+" "+v.model+(v.plate?" • "+v.plate:""))+'</option>').join("")}
async function openAppt(){try{show("apmsg","");await refs();fillSelects();$("av").innerHTML='<option value="">Selecione o cliente primeiro</option>';$("adt").value=$("date").value||today();$("atm").value="08:00";$("ad").showModal()}catch(e){show("msg",fail(e),"error")}}
async function saveAppt(e){e.preventDefault();const b=$("apsave");show("apmsg","");b.disabled=true;b.textContent="Agendando...";try{const s=services.find(x=>x.id===$("as").value);if(!s)throw Error("Selecione o serviço.");const starts=new Date($("adt").value+"T"+$("atm").value+":00").toISOString();let r=await sb.from("appointments").insert({client_id:$("ac").value,vehicle_id:$("av").value,service_id:s.id,collaborator_id:$("acol").value||null,starts_at:starts,duration_minutes:s.duration_minutes,status:"scheduled",source:"internal",base_value:s.price,final_value:s.price,notes:$("an").value,idempotency_key:crypto.randomUUID()});if(r.error)throw r.error;$("ad").close();$("date").value=$("adt").value;show("msg","Agendamento salvo.","ok");tab("age")}catch(e){show("apmsg",fail(e),"error")}finally{b.disabled=false;b.textContent="Agendar"}}
async function loadApps(){const d=$("date").value||today(),a=new Date(d+"T00:00:00").toISOString(),z=new Date(d+"T23:59:59").toISOString();let r=await sb.from("appointments").select("*").gte("starts_at",a).lte("starts_at",z).is("deleted_at",null).order("starts_at");if(r.error)return show("msg",fail(r.error),"error");let allv=[];for(const c of clients){if(!vehicles.has(c.id)){let v=await sb.from("vehicles").select("*").eq("client_id",c.id).is("archived_at",null);if(!v.error)vehicles.set(c.id,v.data||[])}allv=allv.concat(vehicles.get(c.id)||[])}$("apps").innerHTML=(r.data||[]).length?(r.data||[]).map(x=>{const c=clients.find(q=>q.id===x.client_id),v=allv.find(q=>q.id===x.vehicle_id),s=services.find(q=>q.id===x.service_id),co=collabs.find(q=>q.id===x.collaborator_id);let nx=x.status==="scheduled"?"confirmed":x.status==="confirmed"?"in_progress":x.status==="in_progress"?"completed":null;return '<div class="item"><div class="time">'+clock(x.starts_at)+'</div><h3>'+esc(c?.name||"Cliente")+'</h3><div class="meta"><b>'+esc(v?v.brand+" "+v.model:"Veículo")+'</b><br>'+esc(s?.name||"Serviço")+' • '+esc(co?.name||"Equipe não definida")+' • '+money(x.final_value)+'</div><div class="actions" style="margin-top:9px">'+(nx?'<button class="success" data-st="'+nx+'" data-id="'+x.id+'">'+(nx==="confirmed"?"Confirmar":nx==="in_progress"?"Iniciar":"Concluir")+'</button>':"")+(x.status!=="completed"&&x.status!=="cancelled"?'<button class="danger" data-st="cancelled" data-id="'+x.id+'">Cancelar</button>':"")+'</div><span class="pill">'+esc(x.status)+'</span></div>'}).join(""):'<div class="empty">Nenhum agendamento.</div>';document.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{let p={status:b.dataset.st};if(b.dataset.st==="completed")p.completed_at=new Date().toISOString();if(b.dataset.st==="cancelled")p.cancelled_at=new Date().toISOString();let u=await sb.from("appointments").update(p).eq("id",b.dataset.id);if(u.error)return show("msg",fail(u.error),"error");await loadApps()})}
boot();
</script>
</body></html>
