name: Vaporize Next unit tests
on:
  push:
    branches:
      - 'vaporize-next/**'
  workflow_dispatch:
jobs:
  auth-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vaporize-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
