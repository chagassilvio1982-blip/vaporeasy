name: Vaporize Next isolated unit tests

on:
  push:
    branches:
      - vaporize-next/isolado-20261029
    paths:
      - 'vaporize-next/src/**'
      - 'vaporize-next/tests/**'
      - 'vaporize-next/package.json'
      - '.github/workflows/vaporize-next-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: vaporize-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated unit tests
        run: npm test
