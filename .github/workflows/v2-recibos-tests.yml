name: V2 recibos - testes isolados
on:
  push:
    branches:
      - feature/v2-recibos-central-prod-base-20261106
      - feature/v2-refinamento-mobile-20261106
    paths:
      - 'v2-*.js'
      - 'v2-*.css'
      - 'tests/v2-recibos*.cjs'
      - 'index.html'
      - '.github/workflows/v2-recibos-tests.yml'
  workflow_dispatch:
jobs:
  recibos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modelo, interface e segurança sem Supabase
        run: node --test tests/v2-recibos*.test.cjs
