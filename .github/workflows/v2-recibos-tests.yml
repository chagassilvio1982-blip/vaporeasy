name: V2 recibos - testes isolados
on:
  push:
    branches:
      - feature/v2-recibos-central-prod-base-20261106
    paths:
      - 'v2-documento-misto-previa.js'
      - 'tests/v2-recibos-antecipados.test.cjs'
      - '.github/workflows/v2-recibos-tests.yml'
  workflow_dispatch:
jobs:
  recibos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check v2-documento-misto-previa.js
          node --check tests/v2-recibos-antecipados.test.cjs
      - name: Testar modelo sem Supabase
        run: node tests/v2-recibos-antecipados.test.cjs
