<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaporeasy V3 — Login de homologação</title><style>body{font:16px system-ui;background:#07131c;color:#edf7fc;margin:0;padding:24px}.box{max-width:420px;margin:10vh auto;padding:25px;background:#102a39;border-radius:16px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}button{background:#13aeea;border:0;font-weight:700}input{margin-top:5px}#status{white-space:pre-wrap}small{color:#a9c1d0}</style></head><body><main class="box"><h1>Vaporeasy V3</h1><p>Homologação isolada — somente autenticação. Não utilizar dados reais.</p><form id="form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Testar acesso</button></form><p id="status" role="status"></p><small>Banco exclusivo: cfpvexgkjsqpwhebsoos. Esta página não oferece agenda nem financeiro.</small></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://cfpvexgkjsqpwhebsoos.supabase.co','sb_publishable_6nwmh1z_tkjIOj3yyXE4JA_ycJcrRIL',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='Validando acesso à homologação...';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:profile,error:profileError}=await sb.from('app_profiles').select('role,active').eq('user_id',data.user.id).maybeSingle();if(profileError)throw profileError;if(!profile?.active||profile.role!=='owner')throw Error('Perfil de Proprietário ativo não encontrado.');status.textContent='Acesso de Proprietário validado na V3 de homologação.';}catch(err){status.textContent='Não foi possível validar o acesso: '+err.message;}finally{await sb.auth.signOut({scope:'local'}).catch(()=>{});submit.disabled=false;document.getElementById('password').value='';}});
</script></body></html>
