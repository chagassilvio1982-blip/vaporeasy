<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vaporeasy V3 — Homologação</title><style>body{font:16px system-ui;background:#07131c;color:#edf7fc;margin:0;padding:24px}.box{max-width:420px;margin:10vh auto;padding:25px;background:#102a39;border-radius:16px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}button{background:#13aeea;border:0;font-weight:700}input{margin-top:5px}#status{white-space:pre-wrap}small{color:#a9c1d0}[hidden]{display:none!important}</style></head><body><main class="box"><h1>Vaporeasy V3</h1><p>Homologação isolada — somente autenticação. Não utilizar dados reais.</p>
<form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Testar acesso</button></form>
<form id="recovery" hidden><h2>Definir nova senha</h2><label>Nova senha (mínimo 8 caracteres)<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar nova senha<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button id="save" type="submit">Salvar nova senha</button></form>
<p id="status" role="status" aria-live="polite"></p><small>Banco exclusivo: cfpvexgkjsqpwhebsoos. Esta página não oferece agenda nem financeiro.</small></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://cfpvexgkjsqpwhebsoos.supabase.co','sb_publishable_6nwmh1z_tkjIOj3yyXE4JA_ycJcrRIL',{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:true,storageKey:'vaporeasy-v3-recovery-isolated'}});
const login=document.getElementById('login'),recovery=document.getElementById('recovery'),status=document.getElementById('status'),submit=document.getElementById('submit'),save=document.getElementById('save');
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
let recoveryMode=hash.get('type')==='recovery'||query.get('type')==='recovery'||hash.has('access_token')||query.has('code')||query.has('token_hash');
function showRecovery(){recoveryMode=true;login.hidden=true;recovery.hidden=false;status.textContent='Digite e confirme sua nova senha.';}
if(recoveryMode){login.hidden=true;status.textContent='Validando link de recuperação...';}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showRecovery();});
(async()=>{if(!recoveryMode)return;try{if(query.has('token_hash')&&query.get('type')==='recovery'){const {error}=await sb.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});if(error)throw error;}const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session)throw Error('Link expirado ou inválido. Aguarde para solicitar um novo e-mail de recuperação.');showRecovery();}catch(e){login.hidden=true;recovery.hidden=true;status.textContent='Falha ao validar recuperação: '+e.message;}})();
recovery.addEventListener('submit',async e=>{e.preventDefault();const pwd=document.getElementById('new-password').value,confirm=document.getElementById('confirm-password').value;if(pwd!==confirm){status.textContent='As senhas não coincidem.';return;}save.disabled=true;try{const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError||!session)throw Error('Sessão de recuperação inválida. Solicite um novo link.');const {error}=await sb.auth.updateUser({password:pwd});if(error)throw error;status.textContent='Senha atualizada. Você já pode voltar à tela de login e entrar com a nova senha.';recovery.hidden=true;login.hidden=false;history.replaceState(null,'',location.pathname);await sb.auth.signOut({scope:'local'});}catch(err){status.textContent='Não foi possível atualizar: '+err.message;}finally{save.disabled=false;document.getElementById('new-password').value='';document.getElementById('confirm-password').value='';}});
login.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;status.textContent='Validando acesso à homologação...';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:profile,error:profileError}=await sb.from('app_profiles').select('role,active').eq('user_id',data.user.id).maybeSingle();if(profileError)throw profileError;if(!profile?.active||profile.role!=='owner')throw Error('Perfil de Proprietário ativo não encontrado.');status.textContent='Acesso de Proprietário validado na V3 de homologação.';}catch(err){status.textContent='Não foi possível validar o acesso: '+err.message;}finally{await sb.auth.signOut({scope:'local'}).catch(()=>{});submit.disabled=false;document.getElementById('password').value='';}});
</script></body></html>
