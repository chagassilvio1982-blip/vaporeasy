<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vaporize Next — Acesso</title>
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
<main class="shell">
  <section class="panel" aria-labelledby="heading">
    <div class="brand">VAPORIZE <span>NEXT</span></div>
    <p class="eyebrow">Ambiente de homologação</p>
    <h1 id="heading">Acesso seguro</h1>
    <p id="status" role="status" aria-live="polite">Inicializando...</p>
    <form id="login-form" hidden>
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <button type="button" class="secondary" id="forgot">Recuperar senha</button>
    </form>
    <form id="recovery-form" hidden>
      <label for="new-password">Nova senha (mínimo de 12 caracteres)</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Alterar senha e sair</button>
    </form>
    <form id="onboarding-form" hidden>
      <h2>Cadastrar empresa</h2>
      <p>Identidade autenticada. Cadastre sua primeira empresa para solicitar acesso aos módulos.</p>
      <label for="organization-name">Nome da empresa</label>
      <input id="organization-name" type="text" minlength="2" maxlength="160" required>
      <label for="organization-slug">Identificador da empresa</label>
      <input id="organization-slug" type="text" minlength="3" maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*" required>
      <button type="submit">Criar empresa</button>
      <button type="button" id="onboarding-logout" class="secondary">Sair</button>
    </form>
    <section id="workspace" hidden aria-label="Área interna">
      <p>Sessão autenticada. Os módulos operacionais ainda não estão disponíveis.</p>
      <button id="logout" type="button">Sair</button>
    </section>
  </section>
</main>
<script src="./src/ui/config.js"></script>
<script type="module" src="./src/ui/main.js"></script>
</body>
</html>
